<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="LoftPOS  POS Software for Gaming Cafes, Restaurants and Cafes">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="50%" stop-color="#0a1a24"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ee6a6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee6a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="950" cy="120" r="180" fill="#2ee6a6" opacity="0.08"/>
  <circle cx="200" cy="520" r="140" fill="#22d3ee" opacity="0.06"/>
  <rect x="80" y="80" width="64" height="64" rx="16" fill="url(#accent)"/>
  <text x="112" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#061018" text-anchor="middle">L</text>
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff">Loft<tspan fill="#2ee6a6">POS</tspan></text>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff">POS Software for</text>
  <text x="80" y="290" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#accent)">Gaming Cafes, Restaurants</text>
  <text x="80" y="360" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#accent)">&amp; Cafes</text>
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" opacity="0.7">Billing · Inventory · Sessions · QR Ordering · Reports</text>
  <rect x="80" y="480" width="280" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  <text x="80" y="560" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" opacity="0.5">loftpos.com</text>
</svg>
